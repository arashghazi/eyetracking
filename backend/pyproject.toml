[project]
name = "eyetracking-backend"
version = "0.1.0"
description = "Accounts, consent and research data service for the gaze practice apps"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2",
  "pydantic-settings>=2",
  "argon2-cffi>=23",
  "pyjwt>=2.8",
  "numpy>=1.26",
  "opencv-python-headless>=4.9,<5",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
l2cs = ["torch>=2.2", "torchvision>=0.17"]
ai = ["anthropic>=1.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["eyetracking*"]

[tool.setuptools.package-data]
eyetracking = ["infrastructure/ai/assets/*.webm"]
